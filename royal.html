<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal - Demande de Prêt</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #e9e9e9;
  color: #292929;
  font-family: Georgia, "Times New Roman", serif;
}

header {
  height: 106px;
  padding: 15px 25px;
  background: #f7f7f7;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px #0001;
  position: relative;
}

.back {
  color: #444;
  text-decoration: none;
  font-size: 18px;
}

.logo {
  text-align: center;
  color: #c9283d;
  font-family: Arial, sans-serif;
}

.logo strong {
  display: block;
  font-size: 36px;
  letter-spacing: -2px;
}

.logo small {
  font-size: 10px;
}

.menu-button {
  border: none;
  background: transparent;
  font-size: 34px;
  cursor: pointer;
}

.menu {
  position: absolute;
  right: 15px;
  top: 85px;
  z-index: 5;
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 5px 15px #0002;
}

.menu a {
  display: block;
  padding: 10px;
  color: #333;
  text-decoration: none;
}

main {
  padding: 54px 20px 35px;
}

.card {
  max-width: 640px;
  margin: auto;
  background: white;
  border-radius: 18px;
  padding: 46px 34px 52px;
  box-shadow: 0 5px 12px #0001;
}

.heading {
  text-align: center;
  margin-bottom: 62px;
}

h1 {
  margin: 0;
  font-size: 36px;
  font-weight: normal;
}

.subtitle {
  margin-top: 10px;
  color: #929292;
  font-size: 23px;
}

.progress {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-top: 54px;
}

.progress span {
  width: 100px;
  max-width: 25%;
  height: 7px;
  border-radius: 10px;
  background: #dedede;
}

.progress .done {
  background: #606bd5;
}

.field {
  margin-bottom: 30px;
}

label {
  display: block;
  margin-bottom: 14px;
  font-size: 20px;
}

input, select {
  width: 100%;
  height: 76px;
  padding: 0 26px;
  border: 1px solid #cfcfcf;
  border-radius: 12px;
  background: white;
  font-family: Georgia, serif;
  font-size: 19px;
  color: #292929;
  outline: none;
}

input:focus, select:focus {
  border-color: #606bd5;
}

input::placeholder {
  color: #aaa;
}

.phone-row {
  display: flex;
  gap: 13px;
}

.country-code {
  display: grid;
  place-items: center;
  flex: 0 0 105px;
  height: 76px;
  border: 1px solid #cfcfcf;
  border-radius: 12px;
  background: #f6f6f6;
  font-size: 20px;
}

.phone-row input {
  flex: 1;
  min-width: 0;
}

.field small {
  display: block;
  margin-top: 6px;
  color: #888;
  font-size: 16px;
}

.buttons {
  display: grid;
  gap: 26px;
  margin-top: 54px;
}

button.action {
  min-height: 82px;
  width: 100%;
  border: 0;
  border-radius: 14px;
  font: 22px Georgia, serif;
  cursor: pointer;
}

.previous {
  background: #e9e9e9;
  color: #555;
}

.next {
  color: white;
  background: linear-gradient(110deg, #606bd5, #a94bc2);
}

.message {
  color: #b42318;
  font: 15px Arial, sans-serif;
  line-height: 1.5;
}

.review {
  background: #fafafa;
  border: 1px solid #ddd;
  padding: 18px;
  border-radius: 12px;
  font: 15px/1.6 Arial, sans-serif;
  overflow-wrap: anywhere;
}

.review p {
  margin: 8px 0;
}

.confirm {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-top: 20px;
  font: 15px/1.5 Arial, sans-serif;
}

.confirm input {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.notice {
  max-width: 640px;
  margin: 18px auto 0;
  color: #686868;
  font: 13px/1.5 Arial, sans-serif;
}

footer {
  padding: 25px 15px;
  background: #f7f7f7;
  text-align: center;
  color: #888;
  font-size: 16px;
}

[hidden] {
  display: none !important;
}

@media (max-width: 520px) {
  header {
    height: 90px;
    padding: 14px 20px;
  }

  .back {
    font-size: 16px;
  }

  .logo strong {
    font-size: 31px;
  }

  main {
    padding: 24px 14px 28px;
  }

  .card {
    padding: 34px 20px 36px;
  }

  .heading {
    margin-bottom: 44px;
  }

  h1 {
    font-size: 32px;
  }

  .subtitle {
    font-size: 21px;
  }

  .progress {
    margin-top: 42px;
    gap: 12px;
  }

  .progress span {
    height: 6px;
  }

  input, select {
    height: 68px;
    padding: 0 20px;
    font-size: 17px;
  }

  .country-code {
    flex-basis: 88px;
    height: 68px;
    font-size: 18px;
  }

  .phone-row {
    gap: 10px;
  }

  .field small {
    font-size: 14px;
  }

  .buttons {
    margin-top: 42px;
    gap: 22px;
  }

  button.action {
    min-height: 76px;
    font-size: 20px;
  }
}
</style>
</head>

<body>

<header>
  <a href="#" class="back" id="backTop">← Retour</a>

  <div class="logo">
    <strong>Airtel</strong>
    <small>A REASON TO IMAGINE</small>
  </div>

  <button class="menu-button" id="menuButton" aria-label="Menu">☰</button>

  <nav class="menu" id="menu" hidden>
    <a href="#application">Demande de prêt</a>
    <a href="#notice">À propos</a>
  </nav>
</header>

<main id="application">
  <section class="card">

    <div class="heading">
      <h1>Demande de Prêt</h1>
      <div class="subtitle" id="subtitle">Étape 2 sur 3</div>

      <div class="progress">
        <span class="done"></span>
        <span class="done"></span>
        <span></span>
      </div>
    </div>

    <form id="loanForm" novalidate>

      <!-- STEP 1 -->
      <div class="step" data-step="1" hidden>
        <div class="field">
          <label for="amount">Montant souhaité (CDF)</label>
          <input id="amount" type="number" min="1000"
            step="1000" placeholder="Ex. 100000" required>
        </div>

        <div class="field">
          <label for="purpose">Objet du prêt</label>
          <select id="purpose" required>
            <option value="">Choisir une option</option>
            <option>Activité commerciale</option>
            <option>Études</option>
            <option>Dépenses personnelles</option>
            <option>Autre</option>
          </select>
        </div>
      </div>

      <!-- STEP 2 -->
      <div class="step" data-step="2">

        <div class="field">
          <label for="firstName">Prénom</label>
          <input id="firstName" autocomplete="given-name"
            placeholder="Jean" required>
        </div>

        <div class="field">
          <label for="lastName">Nom</label>
          <input id="lastName" autocomplete="family-name"
            placeholder="Dupont" required>
        </div>

        <div class="field">
          <label for="email">Adresse Email</label>
          <input id="email" type="email" autocomplete="email"
            placeholder="jean.dupont@exemple.com" required>
        </div>

        <div class="field">
          <label for="phone">Numéro de Téléphone</label>

          <div class="phone-row">
            <span class="country-code">+243</span>
            <input id="phone" type="tel" inputmode="numeric"
              autocomplete="tel-national"
              placeholder="123456789"
              minlength="9" maxlength="10"
              pattern="[0-9]{9,10}" required>
          </div>

          <small>Entrer 9-10 chiffres (ex: 95xxxxxxx)</small>
        </div>
      </div>

      <!-- STEP 3 -->
      <div class="step" data-step="3" hidden>
        <div class="review">
          <h3>Vérifiez vos informations</h3>
          <p>Vérifiez les informations ci-dessous avant de terminer cette démonstration.</p>
          <div id="reviewDetails"></div>
        </div>

        <label class="confirm">
          <input type="checkbox" id="confirmInfo" required>
          <span>Je confirme que les informations affichées sont correctes.</span>
        </label>
      </div>

      <p class="message" id="message" role="alert"></p>

      <div class="buttons">
        <button type="button" class="action previous" id="previous">
          PRÉCÉDENT
        </button>

        <button type="button" class="action next" id="next">
          ÉTAPE SUIVANTE
        </button>
      </div>

    </form>
  </section>
</main>

<footer>
  © <span id="year"></span> Airtel. Tous droits réservés.
</footer>

<script>
(() => {
  const steps = [...document.querySelectorAll(".step")];
  const bars = [...document.querySelectorAll(".progress span")];
  const subtitle = document.getElementById("subtitle");
  const previous = document.getElementById("previous");
  const next = document.getElementById("next");
  const message = document.getElementById("message");
  const form = document.getElementById("loanForm");
  const menu = document.getElementById("menu");
  let currentStep = 2;

  document.getElementById("year").textContent =
    new Date().getFullYear();

  function showStep(number) {
    currentStep = number;

    steps.forEach(step => {
      step.hidden = Number(step.dataset.step) !== number;
    });

    bars.forEach((bar, index) => {
      bar.classList.toggle("done", index < number);
    });

    subtitle.textContent = `Étape ${number} sur 3`;
    previous.hidden = number === 1;
    next.textContent = number === 3
      ? "TERMINER LA DÉMO"
      : "ÉTAPE SUIVANTE";

    message.textContent = "";
    message.style.color = "#b42318";

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function validateStep() {
    const active = steps.find(
      step => Number(step.dataset.step) === currentStep
    );

    const fields = [...active.querySelectorAll("input, select")];

    for (const field of fields) {
      if (!field.checkValidity()) {
        field.reportValidity();

        message.textContent = field.id === "phone"
          ? "Veuillez entrer un numéro contenant 9 à 10 chiffres."
          : "Veuillez compléter correctement les champs requis.";

        return false;
      }
    }

    return true;
  }

  function createReview() {
    const details = document.getElementById("reviewDetails");

    const rows = [
      ["Montant souhaité", document.getElementById("amount").value
        ? document.getElementById("amount").value + " CDF"
        : "Non renseigné"],
      ["Objet du prêt", document.getElementById("purpose").value || "Non renseigné"],
      ["Prénom", document.getElementById("firstName").value],
      ["Nom", document.getElementById("lastName").value],
      ["Email", document.getElementById("email").value],
      ["Téléphone", "+243 " + document.getElementById("phone").value]
    ];

    details.replaceChildren();

    rows.forEach(([label, value]) => {
      const p = document.createElement("p");
      const strong = document.createElement("strong");

      strong.textContent = label + " : ";
      p.append(strong, document.createTextNode(value || "—"));
      details.appendChild(p);
    });
  }

  previous.addEventListener("click", () => {
    if (currentStep > 1) {
      showStep(currentStep - 1);
    }
  });

  next.addEventListener("click", () => {
    if (!validateStep()) return;

    if (currentStep === 2) {
      let application;

      try {
        application = JSON.parse(
          sessionStorage.getItem("loanApplication") || "{}"
        );
      } catch {
        message.textContent =
          "Impossible de récupérer les informations de votre demande. Veuillez recommencer.";
        return;
      }

      application.applicantFirstName =
        document.getElementById("firstName").value.trim();
      application.applicantLastName =
        document.getElementById("lastName").value.trim();
      application.applicantEmail =
        document.getElementById("email").value.trim();
      application.applicantPhone =
        "+243 " + document.getElementById("phone").value.trim();
      application.royalAmount =
        document.getElementById("amount").value.trim();
      application.royalPurpose =
        document.getElementById("purpose").value.trim();

      sessionStorage.setItem("loanApplication", JSON.stringify(application));
      window.location.href = "summary.html";
      return;
    }

    if (currentStep < 3) {
      showStep(currentStep + 1);
      return;
    }

    message.style.color = "#267342";
    message.textContent =
      "Démo terminée. Aucune demande n'a été envoyée et aucune donnée n'a été enregistrée.";

    next.disabled = true;
    next.textContent = "DÉMO TERMINÉE";
  });

  document.getElementById("backTop").addEventListener("click", event => {
    event.preventDefault();

    if (currentStep > 1) {
      showStep(currentStep - 1);
    }
  });

  document.getElementById("menuButton").addEventListener("click", () => {
    menu.hidden = !menu.hidden;
  });

  menu.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => {
      menu.hidden = true;
    });
  });

  form.addEventListener("submit", event => event.preventDefault());

  showStep(2);
})();
</script>

</body>
</html>
